# Local self-hosted Milvus (standalone) + the Attu web console.
#
#   docker compose -f docker-compose.milvus.yml up -d
#
# Milvus gRPC:   localhost:19530   -> set MILVUS_URI=http://localhost:19530
# Attu console:  http://localhost:8800  (browse the alfred_chunks collection)
#
# etcd + minio are Milvus's internal deps and are NOT published to the host, so
# this stack won't collide with docker-compose.langfuse.yml (which also runs a
# minio/redis). State lives in named volumes — nothing to .gitignore.
#
# Its own compose project (not the default working-dir name) so it stays
# isolated from the langfuse stack — neither can remove the other's containers
# as "orphans".
name: alfred-milvus

services:
  etcd:
    container_name: alfred-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: alfred-milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: alfred-milvus-standalone
    image: milvusdb/milvus:v2.6.18
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"   # gRPC — what MILVUS_URI points at
      - "9091:9091"     # health / metrics
    depends_on:
      - etcd
      - minio

  attu:
    container_name: alfred-milvus-attu
    image: zilliz/attu:v2.6.5
    environment:
      MILVUS_URL: alfred-milvus-standalone:19530
    ports:
      - "8800:3000"     # console at http://localhost:8800
    depends_on:
      - standalone

volumes:
  etcd-data:
  minio-data:
  milvus-data:

networks:
  default:
    name: alfred-milvus
